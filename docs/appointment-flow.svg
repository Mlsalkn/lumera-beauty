<svg xmlns="http://www.w3.org/2000/svg" width="940" height="1045" viewBox="0 0 940 1045" role="img" aria-label="Luméra Beauty · Randevu iş akışı"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#765c4d"/></marker></defs><rect width="100%" height="100%" fill="#faf7f2"/><style>text{font-family:Arial,sans-serif;fill:#332a25}.title{font-size:24px;font-weight:bold}.small{font-size:13px}.head{font-size:16px;font-weight:bold}.body{font-size:15px}</style><text x="28" y="38" class="title">Luméra Beauty · Randevu iş akışı</text><rect x="65" y="80" width="800" height="90" rx="12" fill="#fff" stroke="#c9b7a7"/><text x="83" y="110" class="head">Müşteri giriş yapar</text><text x="83" y="136" class="body">Rol ve aktif hesap kontrol edilir.</text><path d="M465,170 L465,194" stroke="#765c4d" fill="none" stroke-width="2" marker-end="url(#arrow)"/><rect x="65" y="195" width="800" height="90" rx="12" fill="#fff" stroke="#c9b7a7"/><text x="83" y="225" class="head">Hizmet → uzman → tarih → saat</text><text x="83" y="251" class="body">Çalışma saati, mola ve izinlerden müsaitlik bulunur.</text><path d="M465,285 L465,309" stroke="#765c4d" fill="none" stroke-width="2" marker-end="url(#arrow)"/><rect x="65" y="310" width="800" height="90" rx="12" fill="#fff" stroke="#c9b7a7"/><text x="83" y="340" class="head">Özet ve tek kullanımlık onay</text><text x="83" y="366" class="body">10 dakikalık taslak; fiyat/süre tekrar doğrulanır.</text><path d="M465,400 L465,424" stroke="#765c4d" fill="none" stroke-width="2" marker-end="url(#arrow)"/><rect x="65" y="425" width="800" height="90" rx="12" fill="#fff" stroke="#c9b7a7"/><text x="83" y="455" class="head">Transaction ve çalışan satırı kilidi</text><text x="83" y="481" class="body">FOR UPDATE; aktiflik ve çakışma yeniden kontrol edilir.</text><path d="M465,515 L465,539" stroke="#765c4d" fill="none" stroke-width="2" marker-end="url(#arrow)"/><rect x="65" y="540" width="800" height="90" rx="12" fill="#fff" stroke="#c9b7a7"/><text x="83" y="570" class="head">Randevu pending olarak kaydedilir</text><text x="83" y="596" class="body">Fiyat/süre snapshot + geçmiş + bildirim; SMTP varsa kuyruk.</text><path d="M465,630 L465,654" stroke="#765c4d" fill="none" stroke-width="2" marker-end="url(#arrow)"/><rect x="65" y="655" width="800" height="90" rx="12" fill="#fff" stroke="#c9b7a7"/><text x="83" y="685" class="head">Yetkili yönetici / çalışan onayı</text><text x="83" y="711" class="body">confirmed; izin verilen durum geçişleri denetlenir.</text><path d="M465,745 L465,769" stroke="#765c4d" fill="none" stroke-width="2" marker-end="url(#arrow)"/><rect x="65" y="770" width="800" height="90" rx="12" fill="#fff" stroke="#c9b7a7"/><text x="83" y="800" class="head">İşlem biter / yetkili iptal veya tarih değişikliği</text><text x="83" y="826" class="body">completed: bitiş geçtiyse; cancelled: saat tekrar müsait.</text><path d="M465,860 L465,884" stroke="#765c4d" fill="none" stroke-width="2" marker-end="url(#arrow)"/><rect x="65" y="885" width="800" height="90" rx="12" fill="#fff" stroke="#c9b7a7"/><text x="83" y="915" class="head">Müşteri değerlendirme → yönetici moderasyonu</text><text x="83" y="941" class="body">Yalnızca tamamlanan kendi randevusu; bir randevu bir yorum.</text><text x="65" y="1030" class="small">Tarih değişikliği yeniden pending olur. Onaylı izin çakışıyorsa yöneticiye hata gösterilir.</text></svg>